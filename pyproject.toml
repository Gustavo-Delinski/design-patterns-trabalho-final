[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loglite"
version = "1.0.0"
description = "Biblioteca de logging leve e extensível baseada em Design Patterns"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
